# 의존성 버전과 보안 업데이트 PR을 매주 받는다. 생태계마다 버전 업데이트를 한 PR로 묶어 PR 수를 줄이고,
# 보안 업데이트는 묶지 않아 취약점마다 따로 검토한다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    # typescript-eslint가 지원하는 TypeScript 메이저 버전보다 먼저 올리면 npm ci가 peer 의존성 충돌로 실패한다(#262).
    # 그래서 TypeScript 메이저 버전 올림은 typescript-eslint의 지원을 확인한 뒤 사람이 직접 한다.
    # @types/node는 CI와 개발 환경의 Node 메이저(ci.yml node-version)에 맞춘다. 앞서 올리면 그 버전에만 있는 API가 타입 검사를 지나 실행 때 실패한다.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]

  # 외부 액션은 태그가 아니라 커밋 SHA로 고정하고, 뒤에 버전 주석(# v7.0.1)을 단다. 태그는 작성자가 다른 커밋으로 옮길 수 있어서,
  # 배포 역할(id-token)과 패키지 쓰기 권한을 가진 작업에 바뀐 코드가 그대로 들어올 수 있기 때문이다.
  # Dependabot은 SHA와 버전 주석을 함께 새 릴리즈로 올리는 PR을 만든다.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/caddy
    target-branch: develop
    schedule:
      interval: weekly
    # Caddy 이미지의 웹 빌드 단계는 Node LTS만 쓴다. 홀수 메이저 버전은 LTS가 되지 않으므로 메이저 버전 올림은 사람이 직접 고른다.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]

  # mysql은 배포를 되돌려도 버전이 돌아가지 않으므로 사람이 백업을 확인하고 올린다(#574, docs/10 12.4절).
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mysql
    groups:
      docker-compose:
        applies-to: version-updates
        patterns: ["*"]

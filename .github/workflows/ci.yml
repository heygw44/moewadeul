name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  # 배포 워크플로(deploy.yml)가 이미지를 만들기 전에 같은 check를 호출한다.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # develop/main push 실행은 취소하지 않는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # GitHub push protection은 알려진 서비스의 키만 막는다. HMAC 키처럼 형식 없는 값은 gitleaks의 일반 규칙이 본다.
      # 오탐은 .gitleaksignore에 지문으로 적는다.
      - name: Scan history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --no-banner --redact # vv8.30.1

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 우리는 단위·통합·포맷 실패를 한 번에 보려고 --continue를 쓴다
      - run: ./gradlew check --continue --console=plain

      # 테스트 프로필은 조건부 빈을 대부분 끈다. 운영 프로필로 컨텍스트를 한 번 띄워 그 빈들의 기동 실패를 여기서 잡는다(#886).
      - name: 운영 프로필 기동 확인
        if: ${{ !cancelled() }}
        run: |
          ./gradlew bootJar --console=plain
          scripts/boot-prod-context.sh build/libs/*.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/
          retention-days: 14
          if-no-files-found: warn

  # 운영 compose의 Caddy 이미지 태그가 deploy/caddy/Dockerfile의 Caddy 버전·모듈 커밋과 맞는지 본다.
  # 배포 워크플로는 이 태그가 레지스트리에 없을 때만 빌드하므로, 태그를 그대로 두고 Dockerfile만 바꾸면 운영에 반영되지 않는다.
  caddy-image:
    name: caddy-image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/caddy/server-image.sh

  # 운영 Caddy 이미지는 frontend/를 npm ci로 설치해서 빌드한다. 그래서 같은 명령을 PR에서도 돌려, 의존성 충돌이나
  # 타입 오류가 배포 단계가 아니라 PR 단계에서 드러나게 한다(#262). 카카오 키 없이도 빌드는 끝난다.
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # 포맷은 Prettier 설정(frontend/.prettierrc.json)을 따른다. 어긋나면 로컬에서 npm run format으로 고친다
      - run: npm run format:check

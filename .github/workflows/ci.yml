name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  # 배포 워크플로(deploy.yml)가 이미지를 만들기 전에 같은 check를 호출한다.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # develop/main push 실행은 취소하지 않는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # 우리는 단위·통합·포맷 실패를 한 번에 보려고 --continue를 쓴다
      - run: ./gradlew check --continue --console=plain

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 14
          if-no-files-found: warn

  # 운영 Caddy 이미지는 web/을 npm ci로 설치해서 빌드한다. 그래서 같은 명령을 PR에서도 돌려, 의존성 충돌이나
  # 타입 오류가 배포 단계가 아니라 PR 단계에서 드러나게 한다(#262). 카카오 키 없이도 빌드는 끝난다.
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # 포맷은 Prettier 설정(web/.prettierrc.json)을 따른다. 어긋나면 로컬에서 npm run format으로 고친다
      - run: npm run format:check

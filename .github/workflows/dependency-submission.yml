name: Dependency Submission

# GitHub는 Gradle 빌드 파일만 읽어서는 간접 의존성을 알지 못한다. 그래서 이 워크플로가 Gradle로 의존성 그래프를 계산해 제출하고,
# Dependabot은 그 그래프로 간접 의존성의 취약점까지 알린다. 알림은 기본 브랜치 기준이라 develop 푸시에서만 제출한다.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

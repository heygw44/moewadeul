spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  tomcat:
    threads:
      # 외부 응답을 기다리는 스레드가 최대 60개다(날씨 40, OpenAI 10, S3 HEAD 10). 나머지 10개가 DB만 쓰는 요청 몫이라 외부 한도를 올리면 함께 올린다.
      max: 70

logging:
  structured:
    format:
      console: ecs

moewadeul:
  image-storage:
    storage: s3

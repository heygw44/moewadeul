spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  tomcat:
    # 스레드 포화는 HTTP 오류 없이 응답만 늦어져서 tomcat_threads_* 지표로만 보인다.
    mbeanregistry:
      enabled: true
    threads:
      # 값의 근거는 ExternalWaitThreadBudgetTest가 확인한다.
      max: 70

logging:
  structured:
    format:
      console: ecs
    json:
      customizer: com.moewadeul.common.logging.ConstraintValueRedactingLogCustomizer

moewadeul:
  image-storage:
    storage: s3

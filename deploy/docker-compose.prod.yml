# 운영 서버(/opt/moewadeul)에서 deploy.sh가 쓰는 Compose 파일이다. 로컬 개발용은 저장소 루트의 docker-compose.yml이다.
# 값은 deploy.sh가 Parameter Store와 server.env를 합쳐 만든 /opt/moewadeul/.env에서 온다.
# 서비스마다 필요한 변수만 environment에 나열한다. 그래서 앱 컨테이너에는 DB root 비밀번호가 들어가지 않는다.
# 메모리가 2GB인 서버라 서비스마다 한도를 둔다. 지표로 부족이 확인되면 이 값을 조정한다.
name: moewadeul

services:
  caddy:
    image: ${CADDY_IMAGE:?}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    volumes:
      # 인증서와 계정 키를 볼륨에 둔다. 컨테이너를 새로 만들 때마다 인증서를 다시 받으면 Let's Encrypt 발급 한도에 걸린다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    # 행사 신청이 열리는 순간처럼 요청 2,000개가 동시에 앱 응답을 기다리면 Caddy는 약 200MB를 쓴다(연결 하나에 약 0.1MB).
    # 128MB에서는 메모리 한도로 종료돼 응답이 전달되지 않았다.
    mem_limit: 256m

  app:
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    ports:
      # 배포 스크립트가 서버 안에서 /actuator/health를 확인하는 용도라 127.0.0.1에만 연다. 밖에서는 caddy만 보인다.
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      MAIL_USERNAME: ${MAIL_USERNAME:?}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:?}
      PUBLICDATA_SERVICE_KEY: ${PUBLICDATA_SERVICE_KEY:?}
      CI_HMAC_KEY: ${CI_HMAC_KEY:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      UPLOAD_BUCKET: ${UPLOAD_BUCKET:?}
      WEB_BASE_URL: https://${SITE_ADDRESS:?}
      PUBLICDATA_FOREST_FILE: ${PUBLICDATA_FOREST_FILE:-}
      PUBLICDATA_FOREST_STANDARD_FILE: ${PUBLICDATA_FOREST_STANDARD_FILE:-}
      PUBLICDATA_PARK_BOUNDARY_FILE: ${PUBLICDATA_PARK_BOUNDARY_FILE:-}
      # glibc는 스레드가 많으면 malloc 영역(아레나)을 코어 수의 8배까지 만들어 힙 밖 메모리가 커진다.
      # 두 개로 묶으니 지도 조회 부하에서 앱 메모리가 약 150MB 줄었고 응답 시간은 그대로였다.
      MALLOC_ARENA_MAX: "2"
    volumes:
      # 공공데이터 파일(휴양림 CSV, 전국휴양림표준데이터 JSON, 공원 경계 TSV)은 저장소에 없어서 서버의 /opt/moewadeul/data에 둔다.
      - ./data:/data:ro
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 768m
    # 앱은 SIGTERM을 받으면 보내던 메일 한 통을 마치고 끝난다. 메일 서버가 느리면 한 통이 연결·읽기·쓰기 제한 시간(각 5초)까지 걸리고,
    # Spring은 종료 단계마다 최대 30초를 기다린다. 이 유예가 그보다 짧으면 Docker가 먼저 SIGKILL로 끝내서,
    # 집어 둔 메일이 임대 5분 동안 묶이고 메모리에 모아 둔 조회수가 DB에 남지 않는다.
    stop_grace_period: 40s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USERNAME:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 로컬과 같게 DB 시간을 UTC로 둔다.
      - --default-time-zone=+00:00
      # binlog가 켜진 MySQL은 SUPER 권한이 없는 앱 계정의 트리거 생성을 거부한다. 마이그레이션이 지도 묶음 집계용 트리거를 만들어서 켠다.
      # binlog 형식은 ROW라서 트리거가 바꾼 행이 그대로 기록된다.
      - --log-bin-trust-function-creators=1
      # 메모리 한도 640MB 안에서 데이터 캐시(버퍼 풀)에 더 많이 쓰도록 나머지 몫을 줄인다.
      # 기본값에서는 performance_schema가 약 235MB, redo 로그 버퍼가 64MB를 써서, 버퍼 풀이 128MB인데도 한도에 닿았다.
      # performance_schema 통계 표의 크기에 상한을 두면 약 44MB다. Alloy가 읽는 쿼리 통계 표(digest 요약)는 남긴다.
      - --innodb-buffer-pool-size=256M
      - --innodb-log-buffer-size=16M
      # 앱 커넥션 풀 10개와 지표 수집, 백업이 쓰는 연결이면 충분하다.
      - --max-connections=40
      - --performance-schema-digests-size=1000
      - --performance-schema-events-statements-history-long-size=0
      - --performance-schema-events-stages-history-long-size=0
      - --performance-schema-events-waits-history-long-size=0
      - --performance-schema-events-transactions-history-long-size=0
      - --performance-schema-max-thread-instances=100
      - --performance-schema-accounts-size=10
      - --performance-schema-hosts-size=10
      - --performance-schema-users-size=10
      - --performance-schema-max-table-handles=500
      - --performance-schema-max-table-instances=500
      - --performance-schema-max-file-instances=1000
    # 포트를 열지 않는다. 앱은 Compose 내부 네트워크로만 접속한다.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 640m

  # 지표·로그 수집 에이전트. 설정은 deploy/alloy/config.alloy이고, 배포 워크플로가 이 파일 옆 alloy/ 폴더에 받아 둔다.
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      # Alloy의 관리 화면은 컨테이너 안에서만 연다. 포트를 밖에 열지 않는다.
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:?}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:?}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:?}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:?}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:?}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 전송에 실패한 지표를 잠시 쌓아 두는 곳이다. 컨테이너를 새로 만들어도 남게 볼륨에 둔다.
      - alloy-data:/var/lib/alloy/data
      # 서버 지표를 읽으려고 호스트의 /proc, /sys, /를 읽기 전용으로 붙인다.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # DB 백업 스크립트가 남기는 지표 파일(backup.prom)을 읽는다.
      - ./metrics:/host/textfile:ro
      # 컨테이너를 찾고 로그를 읽으려고 Docker 소켓을 붙인다. 이 소켓을 가진 컨테이너는 사실상 서버 root 권한을 가진다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app
      - mysql
    mem_limit: 192m

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
  alloy-data:

spring:
  application:
    name: moewadeul
  profiles:
    default: local
  datasource:
    hikari:
      data-source-properties:
        # Connector/J가 JVM 기본 시간대가 아니라 UTC로 변환해야 MyBatis가 쓴 Instant가 밀리지 않는다.
        connectionTimeZone: UTC
        sessionVariables: innodb_lock_wait_timeout=5
  task:
    scheduling:
      pool:
        size: 4
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    # Spring MVC는 이 이벤트에 세션 ID를 담으려고 요청마다 세션을 열어, 로그인 회원의 모든 요청이 세션 행을 읽고 접근 시각을 다시 쓴다.
    publish-request-handled-events: false
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # JavaMail의 기본 제한 시간은 무제한이다.
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    # 세션 1차 캐시를 쓰면 같은 트랜잭션에서 같은 쿼리를 다시 실행할 때 그 사이 JPA가 flush한 변경이 보이지 않는다.
    local-cache-scope: statement

server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: moewadeul
    distribution:
      # 기본 히스토그램은 시계열마다 구간을 수십 개 만들어 Grafana Cloud 무료 한도(1만 시계열)를 빨리 쓴다.
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
        moewadeul.external.api.requests: 100ms,300ms,1s,3s,10s
  health:
    mail:
      enabled: false

springdoc:
  paths-to-match: /api/**

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    # MySQL은 유니크 제약을 어긴 값을 오류 메시지에 그대로 담고, Hibernate는 그 메시지를 WARN으로 남겨 이메일이나 CI 해시 원값이 로그에 찍힌다.
    org.hibernate.orm.jdbc.error: ERROR

moewadeul:
  identity:
    ci-hmac-key: ${CI_HMAC_KEY:}
    # 실제 본인확인기관을 붙이기 전까지 쓰는 가짜 공급자다. false로 끄면 본인확인 요청이 503으로 끝난다.
    fake-provider:
      enabled: ${IDENTITY_FAKE_PROVIDER_ENABLED:true}
  member:
    mail-secret:
      hmac-key: ${MAIL_SECRET_HMAC_KEY:}
  mail:
    # Gmail은 발신 주소가 로그인한 계정과 다르면 계정 주소로 바꿔 보낸다.
    from: ${spring.mail.username:}
    from-name: ${MAIL_FROM_NAME:뫼와들}
    send-timeout: ${MAIL_SEND_TIMEOUT:20s}
  web:
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  weather:
    kma:
      service-key: ${PUBLICDATA_SERVICE_KEY:}
    kasi:
      service-key: ${PUBLICDATA_SERVICE_KEY:}
  aisearch:
    daily-budget-usd: 1.00
    # gpt-4.1-mini의 공식 가격(100만 토큰당 달러)이다. 2026-10-13에 확인했다.
    input-price-per-million-usd: 0.40
    output-price-per-million-usd: 1.60
    openai:
      api-key: ${OPENAI_API_KEY:}
  publicdata:
    gocamping:
      # 공공데이터포털 인증키는 Decoding 키를 쓴다.
      service-key: ${PUBLICDATA_SERVICE_KEY:}
    forest:
      file: ${PUBLICDATA_FOREST_FILE:}
    forest-standard:
      file: ${PUBLICDATA_FOREST_STANDARD_FILE:}
    park-boundary:
      file: ${PUBLICDATA_PARK_BOUNDARY_FILE:}
  image-storage:
    storage: ${COMMUNITY_IMAGE_STORAGE:fake}
    bucket: ${UPLOAD_BUCKET:}
